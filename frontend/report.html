<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>รายงานสรุปชมรม | SpeedX</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/report.css">
</head>
<body>
  <!-- แถบเครื่องมือ: เห็นเฉพาะบนจอ ตอนพิมพ์จะหายไป -->

    <a class="rt-button" href="dashboard.html" id="back-link"></a>
    <p class="rt-hint">ตัวอย่างก่อนพิมพ์ ขนาด A4 ข้อมูลล่าสุดจาก Google Sheets</p>

  <main class="report-paper" id="report" aria-busy="true">
    <p class="report-loading">กำลังรวบรวมข้อมูล…</p>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/format.js"></script>

</html>
