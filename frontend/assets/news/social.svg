<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
<style>
.c{transform-box:fill-box;transform-origin:center}
.beamL{transform-origin:150px 400px;animation:sweepL 4s ease-in-out infinite}
.beamR{transform-origin:490px 400px;animation:sweepR 4s ease-in-out infinite}
.flag{transform-box:fill-box;transform-origin:50% 0;animation:sway 1.4s ease-in-out infinite}
.f2{animation-delay:.2s}.f3{animation-delay:.4s}.f4{animation-delay:.6s}.f5{animation-delay:.8s}
.sign{animation:blink 1.2s steps(2,end) infinite}
.conf{animation:fall 3s linear infinite}
.k2{animation-delay:-.6s}.k3{animation-delay:-1.2s}.k4{animation-delay:-1.8s}.k5{animation-delay:-2.4s}.k6{animation-delay:-.9s}
.hop{animation:hop .8s ease-in-out infinite}.h2{animation-delay:.4s}
@keyframes sweepL{0%,100%{transform:rotate(-28deg)}50%{transform:rotate(14deg)}}
@keyframes sweepR{0%,100%{transform:rotate(28deg)}50%{transform:rotate(-14deg)}}
@keyframes sway{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(12deg)}}
@keyframes blink{0%{opacity:1}100%{opacity:.35}}
@keyframes fall{from{transform:translateY(-60px) rotate(0)}to{transform:translateY(440px) rotate(540deg)}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="640" height="400" fill="#24123A"/>
<path class="beamL" d="M150 400 L95 -20 L205 -20Z" fill="#FFE08A" opacity=".22"/>
<path class="beamR" d="M490 400 L435 -20 L545 -20Z" fill="#A0EC29" opacity=".2"/>
<path d="M0 50 Q160 95 320 50 T640 50" fill="none" stroke="#F2F5F3" stroke-width="3"/>
<g stroke="#1B1F20" stroke-width="3" stroke-linejoin="round">
<path class="flag" d="M60 63 l20 0 -10 34z" fill="#A0EC29"/><path class="flag f2" d="M180 78 l22 0 -11 36z" fill="#F6B9C8"/><path class="flag f3" d="M300 54 l22 0 -11 36z" fill="#FFE08A"/><path class="flag f4" d="M420 60 l22 0 -11 36z" fill="#305EAA"/><path class="flag f5" d="M545 76 l22 0 -11 36z" fill="#A0EC29"/>
</g>
<g stroke="#1B1F20" stroke-width="5" stroke-linejoin="round">
<path d="M180 220 L320 130 L460 220Z" fill="#A0EC29"/>
<rect x="200" y="220" width="240" height="140" fill="#F2F5F3"/>
<rect x="290" y="270" width="60" height="90" fill="#1B1F20"/>
<rect x="222" y="244" width="48" height="40" fill="#FFE08A"/><rect x="370" y="244" width="48" height="40" fill="#FFE08A"/>
</g>
<g class="sign"><rect x="262" y="166" width="116" height="40" rx="8" fill="#1B1F20"/><text x="320" y="194" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="800" fill="#A0EC29">OPEN</text></g>
<rect x="0" y="360" width="640" height="40" fill="#160B24"/>
<g><circle class="hop" cx="110" cy="330" r="14" fill="#F6B9C8"/><rect class="hop" x="98" y="344" width="24" height="26" rx="10" fill="#F6B9C8"/><circle class="hop h2" cx="530" cy="330" r="14" fill="#A0EC29"/><rect class="hop h2" x="518" y="344" width="24" height="26" rx="10" fill="#A0EC29"/></g>
<g><rect class="c conf" x="80" y="0" width="10" height="16" fill="#A0EC29"/><rect class="c conf k2" x="200" y="0" width="10" height="16" fill="#F6B9C8"/><rect class="c conf k3" x="330" y="0" width="10" height="16" fill="#FFE08A"/><rect class="c conf k4" x="450" y="0" width="10" height="16" fill="#305EAA"/><rect class="c conf k5" x="580" y="0" width="10" height="16" fill="#A0EC29"/><rect class="c conf k6" x="520" y="0" width="8" height="14" fill="#FFE08A"/></g>
</svg>
