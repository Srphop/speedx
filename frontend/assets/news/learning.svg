<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400">
<style>
.c{transform-box:fill-box;transform-origin:center}
.streak{animation:streak 1.6s linear infinite}
.s2{animation-delay:-.5s}.s3{animation-delay:-1.1s}
.draw{stroke-dasharray:520;animation:draw 3.2s ease-in-out infinite}
.pen{transform-box:fill-box;transform-origin:20% 90%;animation:pen 3.2s ease-in-out infinite}
.pop{animation:pop 3.2s cubic-bezier(.3,1.6,.5,1) infinite}
.p2{animation-delay:.25s}.p3{animation-delay:.5s}
.dot{animation:bounce 1.2s ease-in-out infinite}
.d2{animation-delay:.15s}.d3{animation-delay:.3s}.d4{animation-delay:.45s}
.tw{animation:tw 1.8s ease-in-out infinite}.t2{animation-delay:.6s}.t3{animation-delay:1.2s}
.glow{animation:glow 3.2s ease-in-out infinite}
@keyframes streak{from{transform:translateX(-700px)}to{transform:translateX(700px)}}
@keyframes draw{0%{stroke-dashoffset:520}50%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-520}}
@keyframes pen{0%,100%{transform:rotate(-8deg) translate(0,0)}25%{transform:rotate(6deg) translate(-30px,18px)}50%{transform:rotate(-4deg) translate(-60px,-10px)}75%{transform:rotate(8deg) translate(-20px,10px)}}
@keyframes pop{0%,10%{transform:scale(0)}30%,85%{transform:scale(1)}100%{transform:scale(0)}}
@keyframes bounce{0%,100%{transform:translateY(0)}40%{transform:translateY(-22px)}}
@keyframes tw{0%,100%{transform:scale(.3) rotate(0);opacity:.2}50%{transform:scale(1.1) rotate(45deg);opacity:1}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:.7}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;stroke-dashoffset:0!important}}
</style>
<defs><radialGradient id="g" cx="35%" cy="40%" r="60%"><stop offset="0" stop-color="#A0EC29" stop-opacity=".55"/><stop offset="1" stop-color="#A0EC29" stop-opacity="0"/></radialGradient></defs>
<rect width="640" height="400" fill="#141A1C"/>
<circle class="glow" cx="230" cy="190" r="260" fill="url(#g)"/>
<g stroke="#A0EC29" stroke-width="3" stroke-linecap="round" opacity=".5">
<path class="streak" d="M-80 70h140"/><path class="streak s2" d="M-60 330h200"/><path class="streak s3" d="M-90 250h120"/>
</g>
<g transform="rotate(-6 250 200)">
<rect x="120" y="60" width="260" height="290" rx="14" fill="#F2F5F3"/>
<rect x="142" y="82" width="216" height="130" rx="8" fill="#1B1F20"/>
<circle class="c pop" cx="196" cy="140" r="30" fill="#A0EC29"/>
<path class="c pop p2" d="M240 186 L282 108 L326 186Z" fill="#6B46B0"/>
<rect class="c pop p3" x="300" y="96" width="34" height="34" rx="6" fill="#F6B9C8"/>
<rect x="142" y="232" width="170" height="18" rx="5" fill="#1B1F20"/>
<rect x="142" y="262" width="120" height="10" rx="4" fill="#A7B1B0"/>
<rect x="142" y="282" width="150" height="10" rx="4" fill="#A7B1B0"/>
<path class="draw" d="M150 330 C 220 300, 300 330, 370 250" stroke="#2E6B1C" stroke-width="9" fill="none" stroke-linecap="round"/>
</g>
<g class="pen"><g transform="rotate(35 500 210)"><rect x="482" y="90" width="38" height="220" rx="8" fill="#A0EC29" stroke="#1B1F20" stroke-width="4"/><rect x="482" y="90" width="38" height="36" rx="8" fill="#F6B9C8" stroke="#1B1F20" stroke-width="4"/><path d="M482 310 L501 350 L520 310Z" fill="#F4D7A1" stroke="#1B1F20" stroke-width="4" stroke-linejoin="round"/><path d="M494 336 L501 350 L508 336Z" fill="#1B1F20"/></g></g>
<g><circle class="dot" cx="440" cy="352" r="14" fill="#305EAA"/><circle class="dot d2" cx="478" cy="352" r="14" fill="#A35F19"/><circle class="dot d3" cx="516" cy="352" r="14" fill="#8B2549"/><circle class="dot d4" cx="554" cy="352" r="14" fill="#A0EC29"/></g>
<g fill="#F2F5F3"><path class="c tw" d="M86 92l7 16 16 7-16 7-7 16-7-16-16-7 16-7z"/><path class="c tw t2" d="M570 70l5 12 12 5-12 5-5 12-5-12-12-5 12-5z"/><path class="c tw t3" d="M420 40l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#A0EC29"/></g>
</svg>
