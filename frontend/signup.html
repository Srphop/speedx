<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>สมัครบัญชี | SpeedX</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/space.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <main class="auth-page">
    <div class="auth-card">
      <section class="auth-visual">
        <canvas class="space-canvas" aria-hidden="true"></canvas>
        <div class="space-beams" aria-hidden="true"></div>
        <div class="space-glow space-glow-1" aria-hidden="true"></div>
        <div class="space-glow space-glow-2" aria-hidden="true"></div>
        <div class="space-glow space-glow-3" aria-hidden="true"></div>
        <div class="space-center">
          <div class="space-orbit-tilt" aria-hidden="true">
            <div class="space-orbit"><span class="space-orbit-dot"></span></div>
          </div>
          <div class="space-logo-wrap">
            <img class="space-logo" src="assets/logo-original.png" alt="SpeedX">
          </div>
        </div>
        <div class="auth-visual-text">
          <h2>ข่าว กิจกรรม สมาชิก และงบของชมรม ในที่เดียว</h2>
          <p>ข้อมูลอัปเดตตรงจาก Google Sheet ของชมรม ทีมงานทุกคนเห็นตัวเลขชุดเดียวกัน</p>
        </div>
      </section>
      <section class="auth-form-panel">
        <form class="auth-form" id="signup-form" novalidate>
          <div class="auth-form-header">
            <img class="auth-logo logo-light-mode" src="assets/logo-charcoal.png" alt="SpeedX">
            <img class="auth-logo logo-dark-mode" src="assets/logo-original.png" alt="SpeedX">
            <h1>สมัครบัญชี</h1>
            <p class="auth-subtitle">สร้างบัญชีทีมงานชมรม ใช้เวลาไม่ถึงนาที</p>
          </div>
          <p class="form-message" id="form-message" role="alert"></p>
          <div class="field">
            <label for="name">ชื่อ</label>
            <input class="input" id="name" name="name" placeholder="ชื่อ-นามสกุล" type="text" autocomplete="name" aria-describedby="name-error" required>
            <p class="field-error" id="name-error"></p>
          </div>
          <div class="field">
            <label for="email">อีเมล</label>
            <input class="input" id="email" name="email" placeholder="name@example.com" type="email" autocomplete="email" aria-describedby="email-error" required>
            <p class="field-error" id="email-error"></p>
          </div>
          <div class="field">
            <label for="password">รหัสผ่าน</label>
            <div class="password-wrap">
              <input class="input" id="password" name="password" placeholder="รหัสผ่าน" type="password" autocomplete="new-password" aria-describedby="password-error" required>
              <button type="button" class="icon-button password-toggle" data-target="password" aria-label="แสดงรหัสผ่าน"></button>
            </div>
            <p class="form-hint">อย่างน้อย 8 ตัวอักษร</p>
            <p class="field-error" id="password-error"></p>
          </div>
          <div class="field">
            <label for="confirm">ยืนยันรหัสผ่าน</label>
            <div class="password-wrap">
              <input class="input" id="confirm" name="confirm" placeholder="พิมพ์รหัสผ่านอีกครั้ง" type="password" autocomplete="new-password" aria-describedby="confirm-error" required>
              <button type="button" class="icon-button password-toggle" data-target="confirm" aria-label="แสดงรหัสผ่าน"></button>
            </div>
            <p class="field-error" id="confirm-error"></p>
          </div>
          <button class="btn btn-primary" type="submit" id="submit-button">สมัครบัญชี</button>
          <p class="form-hint" id="wake-hint" hidden>เซิร์ฟเวอร์กำลังเริ่มทำงาน ครั้งแรกอาจใช้เวลาประมาณ 1 นาที</p>
          <p class="auth-switch">มีบัญชีแล้ว <a class="text-link" href="login.html">เข้าสู่ระบบ</a></p>
        </form>
      </section>
    </div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/space.js"></script>
  <script src="js/seasonal.js"></script>
  <script src="js/cursor-fx.js"></script>
  <script src="js/auth-form.js"></script>
  <script src="js/pages/signup.js"></script>
</body>
</html>
